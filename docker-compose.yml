services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://erp:erp@db:5432/erp
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-string-in-production-please}
      JWT_EXPIRE_MINUTES: "60"
      UPLOAD_DIR: /data/uploads
      MOCK_PAYMENT_FAIL_RATE: ${MOCK_PAYMENT_FAIL_RATE:-0}
      RUN_SEED_ON_START: ${RUN_SEED_ON_START:-true}
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads

  nginx:
    image: nginx:1.27
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
