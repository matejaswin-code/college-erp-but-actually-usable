<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusERP — College ERP Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div id="login-screen" hidden></div>

<div id="shell" class="container" hidden>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <h2 class="logo">Campus<span>ERP</span></h2>
            <button id="menu-close" class="icon-btn mobile-only" aria-label="Close menu">✕</button>
        </div>

        <p class="menu-title">MENU</p>

        <nav id="tabs"></nav>

        <div class="sidebar-bottom">
            <a href="#" data-tab="settings" id="nav-settings">⚙ Settings</a>
            <a href="#" id="logout">↪ Logout</a>
        </div>
    </aside>

    <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

    <!-- Main Content -->
    <main class="main">

        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <button id="menu-open" class="icon-btn mobile-only" aria-label="Open menu">☰</button>
                <div>
                    <h2 id="page-title">Dashboard</h2>
                    <p id="date">Welcome back!</p>
                </div>
            </div>

            <div class="profile">
                <button id="bell-btn" class="bell-btn" title="Notices" hidden>
                    <span>🔔</span>
                    <span id="bell-badge" class="bell-badge" hidden>0</span>
                </button>
                <div class="avatar" id="user-avatar">U</div>
                <div class="profile-meta">
                    <strong id="user-name">User</strong>
                    <small id="user-role">Student</small>
                </div>
            </div>
        </header>

        <div id="toast-area"></div>
        <div id="app"></div>

        <footer>
            © 2026 CampusERP | Sample Institute of Technology · College Management System
        </footer>

    </main>
</div>

<script src="app.js"></script>
</body>
</html>
